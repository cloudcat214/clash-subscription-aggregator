name: Public Pages release

on:
  pull_request:
    paths:
      - "aggregator/**"
      - "config/**"
      - "tests/**"
      - "docs/**"
      - "scripts/**"
      - "README.md"
      - ".gitignore"
      - "pyproject.toml"
      - ".github/workflows/update.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Offline tests and workflow checks
    runs-on: ubuntu-latest
    outputs:
      pages_changed: ${{ steps.detect_pages_changes.outputs.pages_changed }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Pages artifact changes
        id: detect_pages_changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: >-
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then echo "pages_changed=true" >> "$GITHUB_OUTPUT"; elif [ -n "$EVENT_BEFORE" ] && git diff --name-only "$EVENT_BEFORE" "$GITHUB_SHA" | grep -Eq '^docs/(dist/|history/update-history\.json$)'; then echo "pages_changed=true" >> "$GITHUB_OUTPUT"; else echo "pages_changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run offline tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q aggregator tests

      - name: Check workflow structure
        run: >-
          python -c "from pathlib import Path; import yaml; workflow=yaml.safe_load(Path('.github/workflows/update.yml').read_text(encoding='utf-8')); triggers=workflow.get('on') or workflow.get(True); assert isinstance(triggers, dict) and 'pull_request' in triggers and 'push' in triggers and 'workflow_dispatch' in triggers; assert triggers['push']['branches'] == ['main'] and triggers['push']['paths'] == ['docs/**']; print('workflow structure: passed')"

  deploy:
    name: Deploy committed public Pages artifact
    needs: tests
    if: >-
      ${{
        needs.tests.result == 'success' &&
        needs.tests.outputs.pages_changed == 'true' &&
        github.ref == 'refs/heads/main' &&
        vars.PUBLIC_NODE_REDISTRIBUTION_APPROVED == 'true' &&
        github.event.repository.fork == false
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: public-pages-release
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YAML parser
        run: python -m pip install "PyYAML>=6,<7"

      - name: Sync workspace to latest main before deploy
        run: |
          set -euo pipefail
          git fetch origin main
          git restore --source=origin/main -- docs

      - name: Validate committed public config
        run: >-
          python -c "from pathlib import Path; import yaml; path=Path('docs/dist/clash/config.yaml'); assert path.is_file(), 'missing docs/dist/clash/config.yaml'; document=yaml.safe_load(path.read_text(encoding='utf-8')); assert isinstance(document, dict), 'config root must be a mapping'; assert {'proxies', 'proxy-groups', 'rules'} <= document.keys(), 'config structure incomplete'; assert isinstance(document['proxies'], list), 'proxies must be a list'; print('committed public config: passed')"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
