name: Public Pages release

on:
  pull_request:
    paths:
      - "aggregator/**"
      - "config/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - ".gitignore"
      - "pyproject.toml"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      publish_nodes:
        description: "Publish the currently authorized public sources"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PUBLISH_BASE_URL: https://cloudcat214.github.io/clash-subscription-aggregator/dist
  PUBLISH_CONFIG_URL: https://cloudcat214.github.io/clash-subscription-aggregator/dist/clash/config.yaml

jobs:
  tests:
    name: Offline tests and workflow checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run offline tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q aggregator tests

      - name: Check workflow structure
        run: |
          python - <<'PY'
          from pathlib import Path

          import yaml

          workflow = yaml.load(
              Path(".github/workflows/update.yml").read_text(encoding="utf-8"),
              Loader=yaml.BaseLoader,
          )
          triggers = workflow.get("on") or workflow.get(True)
          assert isinstance(triggers, dict)
          assert "pull_request" in triggers
          assert triggers["schedule"][0]["cron"] == "0 */6 * * *"
          dispatch = triggers["workflow_dispatch"]
          publish_input = dispatch["inputs"]["publish_nodes"]
          assert str(publish_input["default"]).lower() == "false"
          assert publish_input["type"] == "boolean"

          offline_runs = "\n".join(
              str(step.get("run", ""))
              for step in workflow["jobs"]["tests"]["steps"]
              if step.get("name") in {"Run offline tests", "Compile Python sources"}
          )
          assert "python -m pytest -q" in offline_runs
          assert "python -m compileall -q aggregator tests" in offline_runs
          for forbidden in (
              "aggregator run",
              "curl",
              "wget",
              "upload-pages-artifact",
              "deploy-pages",
          ):
              assert forbidden not in offline_runs

          publish = workflow["jobs"]["publish"]
          publish_if = str(publish["if"])
          for required in (
              "schedule",
              "workflow_dispatch",
              "publish_nodes",
              "refs/heads/main",
              "PUBLIC_NODE_REDISTRIBUTION_APPROVED",
              "fork",
          ):
              assert required in publish_if
          assert publish["permissions"] == {
              "contents": "read",
              "pages": "write",
              "id-token": "write",
          }
          assert str(publish["concurrency"]["cancel-in-progress"]).lower() == "false"
          assert publish["concurrency"]["group"] == "public-pages-release"
          checkout = next(
              step
              for step in publish["steps"]
              if step.get("name") == "Checkout main"
          )
          assert checkout["with"]["ref"] == "main"
          publish_runs = "\n".join(
              str(step.get("run", "")) for step in publish["steps"]
          )
          for required in (
              "--no-private",
              "--require-core",
              "--mihomo",
              "--base-url",
              "PUBLISH_BASE_URL",
          ):
              assert required in publish_runs
          assert "actions/configure-pages@v5" in str(publish)
          assert "actions/upload-pages-artifact@v3" in str(publish)
          assert "actions/deploy-pages@v4" in str(publish)
          print("workflow structure: passed")
          PY

  publish:
    name: Build and publish authorized public dist
    needs: tests
    if: >-
      ${{
        needs.tests.result == 'success' &&
        (
          github.event_name == 'schedule' ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.publish_nodes == true
          )
        ) &&
        github.ref == 'refs/heads/main' &&
        vars.PUBLIC_NODE_REDISTRIBUTION_APPROVED == 'true' &&
        github.event.repository.fork == false
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: public-pages-release
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Download trusted Mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="v1.19.32"
          asset="mihomo-linux-amd64-v1.19.32.gz"
          expected_sha256="8451100836c9eda194331c2babfad490b2faf30cebc1a04b0e76fd8ac2d35d10"
          release_tag="$(gh api "repos/MetaCubeX/mihomo/releases/tags/${version}" --jq '.tag_name')"
          test "$release_tag" = "$version"
          asset_names="$(gh api "repos/MetaCubeX/mihomo/releases/tags/${version}" --jq '.assets[].name')"
          printf '%s\n' "$asset_names" | grep -Fxq "$asset"
          mkdir -p .tools
          curl --fail --location --proto '=https' --tlsv1.2 \
            --silent --show-error \
            "https://github.com/MetaCubeX/mihomo/releases/download/${version}/${asset}" \
            --output .tools/mihomo.gz
          echo "${expected_sha256}  .tools/mihomo.gz" | sha256sum -c -
          gzip -dc .tools/mihomo.gz > .tools/mihomo
          chmod +x .tools/mihomo
          mihomo_version="$(.tools/mihomo -v 2>&1)"
          case "$mihomo_version" in
            *"v1.19.32"*) ;;
            *) exit 1 ;;
          esac
          printf 'MIHOMO_PATH=%s\n' "$GITHUB_WORKSPACE/.tools/mihomo" >> "$GITHUB_ENV"

      - name: Build public artifacts
        run: |
          set -euo pipefail
          rm -rf dist state pages
          set +e
          python -m aggregator run \
            --config config/sources.yaml \
            --output dist \
            --state state \
            --no-private \
            --base-url "$PUBLISH_BASE_URL" \
            --mihomo "$MIHOMO_PATH" \
            --probe \
            --probe-max-nodes 30 \
            --probe-rounds 3 \
            --probe-timeout 10 \
            --probe-concurrency 4 \
            --probe-min-verdict stable \
            --require-core
          build_status=$?
          set -e
          if [ "$build_status" -ne 0 ]; then
            python -m aggregator.ci_probe_summary dist/health.json
          fi
          exit "$build_status"

      - name: Check redacted release inputs
        id: artifact_check
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import yaml

          def fail(reason: str) -> None:
              raise SystemExit(f"release_gate_failed:{reason}")

          source_config = yaml.safe_load(
              Path("config/sources.yaml").read_text(encoding="utf-8")
          )
          sources = source_config.get("sources", {})
          public = sources.get("public", [])
          private = sources.get("private", [])
          if len(public) != 3 or any(
              not (
                  item.get("enabled") is True
                  and item.get("publish") is True
                  and item.get("requires_review") is False
              )
              for item in public
          ):
              fail("public_source_gate")
          if any(item.get("enabled") or item.get("publish") for item in private):
              fail("private_source_enabled")

          root = Path("dist")
          required_files = (
              root / "clash/config.yaml",
              root / "clash/providers/aggregate.yaml",
              root / "sing-box/config.json",
              root / "manifest.json",
              root / "health.json",
          )
          if any(not path.is_file() for path in required_files):
              fail("artifact_missing")

          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          health = json.loads((root / "health.json").read_text(encoding="utf-8"))
          MIN_SUCCESSFUL_PUBLIC_SOURCES = 2

          def is_nonnegative_int(value: object) -> bool:
              return (
                  isinstance(value, int)
                  and not isinstance(value, bool)
                  and value >= 0
              )

          if manifest.get("status") != "success":
              fail("manifest_status")
          if health.get("status") != "ok":
              fail("health_status")
          results = manifest.get("sources")
          if not isinstance(results, list) or len(results) != 3:
              fail("source_fetch_or_empty")
          if [item.get("id") for item in results if isinstance(item, dict)] != [
              item.get("id") for item in public
          ]:
              fail("source_identity")
          empty_source_summary = []
          for item in results:
              if not isinstance(item, dict):
                  fail("source_fetch_or_empty")
              accepted = item.get("accepted", 0)
              if not is_nonnegative_int(accepted):
                  fail("source_fetch_or_empty")
              drops = item.get("drops") or {}
              if not isinstance(drops, dict) or any(
                  not isinstance(reason, str)
                  or not is_nonnegative_int(count)
                  for reason, count in drops.items()
              ):
                  fail("source_fetch_or_empty")
              if accepted == 0:
                  drop_text = ", ".join(
                      f"{reason}={count}" for reason, count in sorted(drops.items())
                  ) or "none"
                  empty_source_summary.append(
                      f"- {str(item.get('id') or 'unknown')}: "
                      f"accepted=0; drops: {drop_text}"
                  )
          health_results = health.get("sources")
          if (
              not isinstance(health_results, list)
              or len(health_results) != len(results)
              or any(not isinstance(item, dict) for item in health_results)
              or [item.get("id") for item in health_results]
              != [item.get("id") for item in results]
          ):
              fail("health_source_structure")
          if any(
              item.get("drops", {}) != health_item.get("drops", {})
              for item, health_item in zip(results, health_results)
          ):
              fail("health_source_drops")
          if any(
              item.get("kind") != "public" or item.get("status") != "ok"
              for item in results
          ):
              fail("source_fetch_or_empty")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(
                  f"min_successful_public_sources={MIN_SUCCESSFUL_PUBLIC_SOURCES}\n"
              )
              output.write("empty_source_summary<<EOF\n")
              output.write(("\n".join(empty_source_summary) or "- none") + "\n")
              output.write("EOF\n")
          successful_public_sources = [
              item for item in results if item.get("accepted", 0) > 0
          ]
          if len(successful_public_sources) < MIN_SUCCESSFUL_PUBLIC_SOURCES:
              fail("source_fetch_or_empty")
          verification = manifest.get("verification")
          node_quality = manifest.get("node_quality")
          if not isinstance(verification, dict) or verification.get("status") != "performed":
              fail("probe_not_performed")
          if not isinstance(node_quality, dict):
              fail("node_quality_missing")
          validation = manifest.get("core_validation", {})
          mihomo = validation.get("clients", {}).get("mihomo", {})
          if mihomo.get("status") != "passed":
              fail("core_validation")
          counts = manifest.get("counts")
          if not isinstance(counts, dict):
              fail("manifest_counts")
          published = counts.get("published")
          if not is_nonnegative_int(published) or published <= 0:
              fail("manifest_published_count")
          if node_quality.get("published") != published:
              fail("node_quality_published_mismatch")
          for key in (
              "candidates",
              "published",
              "tested",
              "verified",
              "fast",
              "stable",
              "failed",
              "not_tested",
              "not_tested_budget",
              "failed_probe",
              "below_quality_threshold",
              "dropped",
          ):
              if not is_nonnegative_int(node_quality.get(key)):
                  fail("node_quality_counts")
          if node_quality["tested"] > 30 or node_quality["published"] > 30:
              fail("probe_budget")
          if node_quality["not_tested"] + node_quality["tested"] != node_quality["candidates"]:
              fail("node_quality_coverage")
          if node_quality["stable"] + node_quality["failed"] + node_quality["not_tested"] != node_quality["candidates"]:
              fail("node_quality_classification")
          if node_quality["failed"] != node_quality["failed_probe"] + node_quality["below_quality_threshold"]:
              fail("node_quality_failure_categories")
          if node_quality["dropped"] != node_quality["failed_probe"] + node_quality["below_quality_threshold"]:
              fail("node_quality_dropped_categories")
          if node_quality["not_tested_budget"] > node_quality["not_tested"]:
              fail("node_quality_budget_coverage")
          if node_quality["verified"] > node_quality["stable"]:
              fail("node_quality_verdict_order")
          if node_quality["published"] > node_quality["stable"]:
              fail("published_below_quality_gate")

          clash = yaml.safe_load(
              (root / "clash/config.yaml").read_text(encoding="utf-8")
          )
          proxies = clash.get("proxies") if isinstance(clash, dict) else None
          if (
              not isinstance(clash, dict)
              or not isinstance(proxies, list)
              or not proxies
              or published != len(proxies)
          ):
              fail("clash_structure")
          sing_box = json.loads(
              (root / "sing-box/config.json").read_text(encoding="utf-8")
          )
          if not isinstance(sing_box.get("outbounds"), list):
              fail("sing_box_structure")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"published_count={published}\n")
              for key in (
                  "candidates",
                  "tested",
                  "verified",
                  "fast",
                  "stable",
                  "failed",
                  "not_tested",
                  "not_tested_budget",
                  "failed_probe",
                  "below_quality_threshold",
                  "dropped",
              ):
                  output.write(f"node_quality_{key}={node_quality[key]}\n")
              output.write("verification_status=build_core_passed\n")
          print("release inputs: passed")
          PY

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p pages
          cp -a dist pages/dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify fixed public URL
        id: http_verify
        env:
          EXPECTED_COUNT: ${{ steps.artifact_check.outputs.published_count }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          import yaml

          expected = int(os.environ["EXPECTED_COUNT"])
          url = os.environ["PUBLISH_CONFIG_URL"]
          last_reason = "not_attempted"
          for _ in range(18):
              try:
                  request = Request(url, headers={"User-Agent": "clash-subscription-aggregator"})
                  with urlopen(request, timeout=20) as response:
                      status = response.status
                      content_type = response.headers.get_content_type()
                      body = response.read(25 * 1024 * 1024 + 1)
                  if status != 200:
                      last_reason = "http_status"
                  elif content_type in {"text/html", "application/xhtml+xml", ""}:
                      last_reason = "content_type"
                  elif not body or len(body) > 25 * 1024 * 1024:
                      last_reason = "content_size"
                  else:
                      document = yaml.safe_load(body)
                      proxies = document.get("proxies") if isinstance(document, dict) else None
                      if (
                          isinstance(document, dict)
                          and {"proxies", "proxy-groups", "rules"}.issubset(document)
                          and isinstance(proxies, list)
                          and len(proxies) == expected
                          and expected > 0
                      ):
                          with Path(os.environ["GITHUB_OUTPUT"]).open(
                              "a", encoding="utf-8"
                          ) as output:
                              output.write("verification_status=http_200_yaml_passed\n")
                          print("fixed URL verification: passed")
                          raise SystemExit(0)
                      last_reason = "yaml_structure"
              except Exception as exc:  # noqa: BLE001 - response body is never logged
                  last_reason = type(exc).__name__
              time.sleep(10)
          raise SystemExit(f"fixed_url_verification_failed:{last_reason}")
          PY

      - name: Write redacted Step Summary
        if: always()
        env:
          RELEASE_STATUS: ${{ job.status }}
          PUBLISHED_COUNT: ${{ steps.artifact_check.outputs.published_count || '0' }}
          NODE_QUALITY_TESTED: ${{ steps.artifact_check.outputs.node_quality_tested || '0' }}
          NODE_QUALITY_NOT_TESTED_BUDGET: ${{ steps.artifact_check.outputs.node_quality_not_tested_budget || '0' }}
          NODE_QUALITY_FAILED_PROBE: ${{ steps.artifact_check.outputs.node_quality_failed_probe || '0' }}
          NODE_QUALITY_BELOW_THRESHOLD: ${{ steps.artifact_check.outputs.node_quality_below_quality_threshold || '0' }}
          NODE_QUALITY_DROPPED: ${{ steps.artifact_check.outputs.node_quality_dropped || '0' }}
          PROBE_ERROR_TOTAL: ${{ env.PROBE_ERROR_TOTAL || '0' }}
          PROBE_ERROR_CATEGORIES: ${{ env.PROBE_ERROR_CATEGORIES || 'not_available' }}
          MIN_SUCCESSFUL_PUBLIC_SOURCES: ${{ steps.artifact_check.outputs.min_successful_public_sources || '2' }}
          EMPTY_SOURCE_SUMMARY: ${{ steps.artifact_check.outputs.empty_source_summary || 'not_available' }}
          VERIFICATION_STATUS: ${{ steps.http_verify.outputs.verification_status || 'not_run' }}
        run: |
          {
            echo "## Public Pages release"
            echo "- status: ${RELEASE_STATUS}"
            echo "- minimum successful public sources: ${MIN_SUCCESSFUL_PUBLIC_SOURCES}"
            echo "- published count: ${PUBLISHED_COUNT}"
            echo "- node quality tested: ${NODE_QUALITY_TESTED}"
            echo "- node quality not tested by budget: ${NODE_QUALITY_NOT_TESTED_BUDGET}"
            echo "- node quality failed probe: ${NODE_QUALITY_FAILED_PROBE}"
            echo "- node quality below threshold: ${NODE_QUALITY_BELOW_THRESHOLD}"
            echo "- node quality dropped after probe: ${NODE_QUALITY_DROPPED}"
            echo "- probe error total: ${PROBE_ERROR_TOTAL}"
            echo "- probe error categories: ${PROBE_ERROR_CATEGORIES}"
            echo "- verification status: ${VERIFICATION_STATUS}"
            echo "- empty public source drops:"
            printf '%s\n' "${EMPTY_SOURCE_SUMMARY}"
            echo "- fixed URL: ${PUBLISH_CONFIG_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
