name: Cloud auto refresh

on:
  schedule:
    # 每小时触发一次。GitHub 对公共仓库的 schedule 是 best-effort：
    # 只代表触发请求，实际可能延迟甚至被跳过。
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: public-pages-release
  cancel-in-progress: false

env:
  MIHOMO_VERSION: v1.19.32
  MIHOMO_ASSET: mihomo-linux-amd64-v1.19.32.gz
  # Source: official MetaCubeX/mihomo v1.19.32 release asset, checked 2026-10-11.
  MIHOMO_SHA256: 8451100836c9eda194331c2babfad490b2faf30cebc1a04b0e76fd8ac2d35d10
  AUTO_PROBE_MAX_NODES: "1800"
  AUTO_PROBE_CONCURRENCY: "16"
  AUTO_PROBE_TIMEOUT: "8"

jobs:
  refresh:
    name: Refresh and deploy cloud subscription
    if: vars.PUBLIC_NODE_REDISTRIBUTION_APPROVED == 'true' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e .

      - name: Download and verify Mihomo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --silent --show-error \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/${MIHOMO_ASSET}" \
            --output mihomo.gz
          echo "${MIHOMO_SHA256}  mihomo.gz" | sha256sum --check --status
          gzip --decompress --stdout mihomo.gz > mihomo
          chmod +x mihomo
          ./mihomo -v

      - name: Restore verified pool cache
        id: pool-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            state/verified-pool-auto.json.enc
            state/verified-pool-auto.json.enc.mac
            state/failed-pool-auto.json.enc
            state/failed-pool-auto.json.enc.mac
          key: verified-pool-${{ github.run_id }}
          restore-keys: |
            verified-pool-

      - name: Decrypt verified pool
        shell: bash
        env:
          POOL_PASS: ${{ secrets.POOL_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p state
          if [ -z "${POOL_PASS:-}" ]; then
            echo "passphrase not configured; cold start"
            exit 0
          fi
          restored=false
          for pool_name in verified-pool-auto failed-pool-auto; do
            encrypted="state/${pool_name}.json.enc"
            mac="${encrypted}.mac"
            plain="state/${pool_name}.json"
            if [ ! -f "$encrypted" ] || [ ! -f "$mac" ]; then
              rm -f "$encrypted" "$mac" "$plain"
              continue
            fi
            if python -c "import hashlib,hmac,os,sys; from pathlib import Path; data=Path(sys.argv[1]).read_bytes(); actual=Path(sys.argv[2]).read_text(encoding='ascii').strip(); expected=hmac.new(os.environ['POOL_PASS'].encode(),data,hashlib.sha256).hexdigest(); raise SystemExit(0 if hmac.compare_digest(actual,expected) else 1)" "$encrypted" "$mac" && \
               openssl enc -d -aes-256-cbc -pbkdf2 -salt -pass env:POOL_PASS \
                 -in "$encrypted" -out "$plain" 2>/dev/null; then
              chmod 600 "$plain"
            else
              echo "${pool_name} cache authentication/decrypt failed; cold start for this pool"
              rm -f "$plain" "$encrypted" "$mac"
            fi
          done
          if [ -f state/verified-pool-auto.json ] || [ -f state/failed-pool-auto.json ]; then
            if python -c "import sys; from pathlib import Path; from aggregator.failed_pool import load_runtime_pools; load_runtime_pools(Path(sys.argv[1]),Path(sys.argv[2]))" state/verified-pool-auto.json state/failed-pool-auto.json; then
              restored=true
            else
              echo "pool cache semantic validation failed; cold start"
              rm -f state/verified-pool-auto.json state/failed-pool-auto.json \
                state/verified-pool-auto.json.enc state/verified-pool-auto.json.enc.mac \
                state/failed-pool-auto.json.enc state/failed-pool-auto.json.enc.mac
              restored=false
            fi
          fi
          if [ "$restored" != true ]; then
            echo "no pool cache restored; cold start"
          else
            echo "pool caches restored"
          fi

      - name: Run cloud aggregation and probe
        shell: bash
        run: |
          set -euo pipefail
          started_at=$(date +%s)
          python -m aggregator run \
            --config config/sources.yaml \
            --output dist-auto \
            --state state-auto \
            --verified-pool state/verified-pool-auto.json \
            --failed-pool state/failed-pool-auto.json \
            --no-private \
            --mihomo "$GITHUB_WORKSPACE/mihomo" \
            --require-core \
            --probe \
            --probe-backend delay \
            --probe-max-nodes "$AUTO_PROBE_MAX_NODES" \
            --probe-rounds 3 \
            --probe-timeout "$AUTO_PROBE_TIMEOUT" \
            --probe-concurrency "$AUTO_PROBE_CONCURRENCY" \
            --probe-min-verdict stable \
            --base-url "https://cloudcat214.github.io/clash-subscription-aggregator/dist"
          finished_at=$(date +%s)
          echo "cloud refresh duration_seconds=$((finished_at - started_at)) probe_max_nodes=$AUTO_PROBE_MAX_NODES"
          test -s dist-auto/clash/config.yaml
          python -c "import json; from pathlib import Path; m=json.loads(Path('dist-auto/manifest.json').read_text(encoding='utf-8')); q=m.get('node_quality', {}); print('cloud publish counts: published=%s tested=%s pool_retested=%s' % (m.get('counts', {}).get('published', 0), q.get('tested', 0), m.get('verification', {}).get('pool_retested', 0)))"

      - name: Encrypt verified pool
        id: pool-encrypt
        if: always()
        shell: bash
        env:
          POOL_PASS: ${{ secrets.POOL_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${POOL_PASS:-}" ]; then
            echo "passphrase not configured; skip pool cache save"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! python -c "import sys; from pathlib import Path; from aggregator.failed_pool import load_runtime_pools; load_runtime_pools(Path(sys.argv[1]),Path(sys.argv[2]))" state/verified-pool-auto.json state/failed-pool-auto.json; then
            echo "pool semantic validation failed; skip pool cache save"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ready=false
          for pool_name in verified-pool-auto failed-pool-auto; do
            plain="state/${pool_name}.json"
            encrypted="state/${pool_name}.json.enc"
            if [ -f "$plain" ] && \
               python -c "import json; json.load(open('$plain', encoding='utf-8'))"; then
              openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:POOL_PASS \
                -in "$plain" -out "$encrypted"
              python -c "import hashlib,hmac,os,sys; from pathlib import Path; data=Path(sys.argv[1]).read_bytes(); Path(sys.argv[2]).write_text(hmac.new(os.environ['POOL_PASS'].encode(),data,hashlib.sha256).hexdigest(),encoding='ascii')" "$encrypted" "${encrypted}.mac"
              chmod 600 "$plain" "$encrypted" "${encrypted}.mac"
              ready=true
            else
              echo "no valid $pool_name file; skip its cache save"
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Save verified pool cache
        if: always() && steps.pool-encrypt.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            state/verified-pool-auto.json.enc
            state/verified-pool-auto.json.enc.mac
            state/failed-pool-auto.json.enc
            state/failed-pool-auto.json.enc.mac
          key: verified-pool-${{ github.run_id }}

      - name: Stage dist and auto Pages channels
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/dist docs/auto
          mkdir -p docs/dist docs/auto
          cp -a dist-auto/. docs/dist/
          cp -a dist-auto/. docs/auto/

      - name: Build cn-filtered channel
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_cn_channel.py \
            --dist-dir dist-auto \
            --feedback cn-feedback/latest.json \
            --output docs/cn

      - name: Commit changed auto artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/dist docs/auto docs/cn
          if git diff --cached --quiet; then
            echo "no material change; skip commit/push."
          else
            changed_paths=$(git diff --cached --name-only)
            if printf '%s\n' "$changed_paths" | grep -Ev '^(docs/(dist|auto|cn)/)' | grep -q .; then
              echo "unexpected staged path" >&2
              printf '%s\n' "$changed_paths" >&2
              exit 1
            fi
            git commit -m "refresh: cloud verified nodes (run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT})"
            pushed=false
            for attempt in 1 2 3; do
              if ! git pull --rebase origin main; then
                git rebase --abort 2>/dev/null || true
                echo "pull --rebase failed" >&2
                exit 1
              fi
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
            done
            if [ "$pushed" != true ]; then
              echo "push failed after 3 attempts" >&2
              exit 1
            fi
          fi

      - name: Sync workspace to latest main before deploy
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git restore --source=origin/main -- docs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
