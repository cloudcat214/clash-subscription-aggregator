# 只启用已经获得授权、并确认可以公开发布的来源。
# private 来源默认 publish=false；密钥或订阅 URL 通过 env 注入，不写进仓库。
version: 1

settings:
  timeout_seconds: 15
  retries: 2
  retry_backoff_seconds: 0.5
  max_redirects: 3
  allow_http_sources: false
  max_payload_bytes: 5242880
  max_nodes: 0
  min_publish_nodes: 1
  max_shrink_ratio: 0.2
  active_probe: false
  probe_max_nodes: 30
  probe_rounds: 3
  probe_timeout_seconds: 10
  probe_concurrency: 1
  probe_interface: ""
  probe_min_verdict: stable
  probe_publish_max_nodes: 500
  probe_verified_min_rounds: 3
  probe_stable_min_rounds: 3
  probe_min_success_rate: 0.6666666667
  probe_fast_latency_ms: 800
  probe_score_latency_cap_ms: 5000
  # Only these explicitly approved public endpoints are trusted for source retrieval.
  allowed_source_hosts:
    - raw.githubusercontent.com
    - www.gitlabip.xyz
    - gitlab.com
  trust_hosts:
    - raw.githubusercontent.com
    - www.gitlabip.xyz
    - gitlab.com
  # Controlled DNS addresses may drift: register each observed address explicitly
  # and re-validate it. This is for the controlled environment, not a general proxy.
  controlled_proxy_addresses:
    - 198.18.0.21
    - 198.18.1.48
    - 198.18.0.37
  filters:
    allow_protocols: []
    deny_protocols: []
    deny_name_keywords: []
    min_quality_score: 0

