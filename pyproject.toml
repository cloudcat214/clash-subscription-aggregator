[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clash-mihomo-aggregator"
version = "0.1.0"
description = "安全、离线可回归的 Clash/Mihomo 订阅聚合器"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["aggregator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
